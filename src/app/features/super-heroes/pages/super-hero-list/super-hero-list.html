<div class="table-container">
  <div class="toolbar">
    <app-hero-search (searchTerm)="onSearch($event)" />
    <button type="button" class="create" (click)="onCreate()">Nuevo heroe</button>
  </div>
  <app-hero-table
    [heroes]="heroes()"
    (editHero)="onEdit($event)"
    (deleteHero)="onDelete($event)"
  />
</div>
